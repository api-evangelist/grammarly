aid: grammarly
name: Grammarly
description: >-
  Grammarly is an AI writing-assistance company whose enterprise developer
  platform exposes a set of REST APIs that bring Grammarly's writing
  intelligence into an organization's own applications, business-intelligence
  systems, and IT tooling. The Grammarly APIs cover writing-quality scoring, AI
  generated-content detection, plagiarism detection, communication analytics,
  and license management, all secured with OAuth 2.0 client credentials and
  scoped permissions against the base URL https://api.grammarly.com/ecosystem/api/.
  Certified Readability Score and Tone Analysis APIs are announced as coming
  soon. Grammarly was surfaced as a portfolio company of IVP.
