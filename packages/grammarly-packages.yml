  Detection, Plagiarism, License Management) are documented with copy-paste code
  samples in Bash/Python/Java/Node.js/C# but ship no dedicated first-party REST
  client SDK package. The first-party libraries published to the @grammarly npm
  organization below are client/editor and front-end libraries; the
  @grammarly/textarea plugin family relates to the (deprecated Jan 2024)
  Grammarly Text Editor SDK. Numerous unofficial "grammarly-api" packages exist
  on npm and are excluded here.
